<!DOCTYPE html>
<html>
<head>
	<title>SQUARE INSIDE A SQUARE</title>
	<meta charset="utf-8">
	<!-- Compiled w/ P5LIVE, http://github.com/ffd8/p5live -->
	<style type="text/css">
		body{
			margin:0;
			overflow:hidden;
		}
		canvas{
			position:fixed;
			top:0;
			left:0;
			z-index:-1;
			width:100vw;
			height:100vh;
			margin:0;
		}
	</style>
	<script type="text/javascript">
		// eco-mode = only render if window focused
		window.onblur = function () {
			noLoop();
		};
		window.onfocus = function () {
			loop();
		};
	</script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/p5@1/lib/p5.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/gh/processing/p5.js-sound/lib/p5.sound.min.js"></script>
</head>
<body style="background: rgb(0, 0, 0);">

<script type="text/javascript">
//SQUARE INSIDE A SQUARE

/* CUSTOM FUNCTIONS FOR P5LIVE */
// keep fullscreen if window resized
function windowResized() {
	resizeCanvas(windowWidth, windowHeight);
}

// custom ease function
function ease(iVal, oVal, eVal){
	return oVal += (iVal - oVal) * eVal;
}

// processing compatibility
function println(msg){
	print(msg);
}


function setup() {
	createCanvas(windowWidth, windowHeight)
	background (0)
	frameRate(10)
	rectMode(CENTER)
	
	//this is ignored
}

let dim = 200
let reduction = 20
let posX = 700
let posY = 300




function draw() {
	//paint program very basic
	fill(0)
	stroke(255)
	strokeWeight(3)
	square(posX,posY,dim)
	square(posX,posY,dim - (reduction * 1))
	square(posX,posY,dim - (reduction * 2))
	square(posX,posY,dim - (reduction * 3))
	square(posX,posY,dim - (reduction * 4))
	square(posX,posY,dim - (reduction * 5))
	
	// for loop 
	
	for(let i=0; i<6; i++){
	square(posX+300, posY, dim-(reduction * i))
}
	for(let i=0; i<10; i++){
	square(posX+500, posY+100, (dim+100) -(reduction * i))
	
		
	}


}


</script>

</body>
</html>
